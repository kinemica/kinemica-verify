[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinemica-verify"
version = "0.3.0"
description = "Open-source verification infrastructure for physical-world work."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Sylvester Kaczmarek" }
]
keywords = ["verification", "robotics", "agents", "physical-ai", "safety", "telemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cryptography>=50,<51",
  "jsonschema>=4.20,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
kinemica = "kinemica_verify.cli:main"

[project.urls]
Homepage = "https://kinemica.com"
Repository = "https://github.com/kinemica/kinemica-verify"
Issues = "https://github.com/kinemica/kinemica-verify/issues"
Changelog = "https://github.com/kinemica/kinemica-verify/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kinemica/kinemica-verify/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinemica_verify = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
