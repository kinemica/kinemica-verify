name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or commit to publish
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kinemica-verify
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Verify public PyPI install (Python ${{ matrix.python-version }})
    needs: [build, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install released package from public PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          python -m venv .pypi-venv
          for attempt in {1..12}; do
            if .pypi-venv/bin/python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --index-url https://pypi.org/simple/ \
              "kinemica-verify==${VERSION}"; then
              break
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "kinemica-verify ${VERSION} was not installable from PyPI." >&2
              exit 1
            fi
            sleep 10
          done
          .pypi-venv/bin/python -m pip check
          test "$(.pypi-venv/bin/python -c 'from importlib.metadata import version; print(version("kinemica-verify"))')" = "${VERSION}"
          .pypi-venv/bin/kinemica --help
          .pypi-venv/bin/kinemica ingest-trace --help
          .pypi-venv/bin/kinemica keygen \
            --private-key /tmp/kinemica-pypi.private.pem \
            --public-key /tmp/kinemica-pypi.public.pem
