name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Trace ingestion reproducibility
        run: |
          kinemica ingest-trace \
            examples/filter-replacement/evidence/trace.jsonl \
            examples/filter-replacement/evidence \
            --force
          git diff --exit-code -- examples/filter-replacement/evidence/manifest.yaml
      - name: Example verification
        run: kinemica verify examples/filter-replacement/work.yaml examples/filter-replacement/evidence
      - name: Signed record round trip
        run: |
          kinemica keygen \
            --private-key /tmp/kinemica-ci.private.pem \
            --public-key /tmp/kinemica-ci.public.pem
          kinemica verify \
            examples/filter-replacement/work.yaml \
            examples/filter-replacement/evidence \
            --signing-key /tmp/kinemica-ci.private.pem \
            --record /tmp/kinemica-ci-record.json
          kinemica verify-record \
            /tmp/kinemica-ci-record.json \
            /tmp/kinemica-ci.public.pem \
            --contract examples/filter-replacement/work.yaml \
            --evidence examples/filter-replacement/evidence

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/kinemica-wheel-smoke
          /tmp/kinemica-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/kinemica-wheel-smoke/bin/kinemica --help
          /tmp/kinemica-wheel-smoke/bin/kinemica ingest-trace --help
